# https://taskfile.dev

version: '3'

vars:
  TARGET: mac

tasks:
  default:
    cmds:
      - task --list
    silent: true

  format:nix:
    desc: "Format all Nix files with alejandra"
    sources:
      - "**/*.nix"
    cmds:
      - find . -name '*.nix' -not -path './.git/*' | xargs alejandra

  format:lua:
    desc: "Format all Lua files with stylua"
    sources:
      - "**/*.lua"
    cmds:
      - find . -name '*.lua' -not -path './.git/*' | xargs stylua

  format:
    desc: "Format all Nix and Lua files"
    deps: [format:nix, format:lua]

  check:nix:
    desc: "Check Nix formatting (dry-run)"
    cmds:
      - find . -name '*.nix' -not -path './.git/*' | xargs alejandra --check

  check:lua:
    desc: "Check Lua formatting (dry-run)"
    cmds:
      - find . -name '*.lua' -not -path './.git/*' | xargs stylua --check

  check:shell:
    desc: "Test zsh startup with isolated fixture files and commands"
    cmds:
      - python3 tests/test_shell_startup.py

  check:tasks:
    desc: "Test target selection and lock-safe commands using Task dry-runs"
    cmds:
      - python3 tests/test_taskfile.py

  check:identity:
    desc: "Test HOME/USER evaluation with isolated environment fixtures"
    cmds:
      - python3 tests/test_home_identity.py

  check:
    desc: "Check formatting, portable shell startup, identity, and Task commands"
    deps: [check:nix, check:lua, check:shell, check:tasks, check:identity]

  build:
    desc: "Build Home Manager without applying or updating dependencies"
    requires:
      vars:
        - name: TARGET
          enum: [mac, linux, linux-arm64]
    cmds:
      - nix build --impure --no-update-lock-file ".#homeConfigurations.{{index (dict "mac" "myHomeConfig" "linux" "linuxHomeConfig" "linux-arm64" "linuxArmHomeConfig") .TARGET}}.activationPackage"

  apply:
    desc: "Apply Home Manager using the existing lock file"
    aliases: [sync]
    preconditions:
      - sh: test "$(uname -s):$(uname -m)" = '{{index (dict "mac" "Darwin:arm64" "linux" "Linux:x86_64" "linux-arm64" "Linux:aarch64") .TARGET}}'
        msg: "TARGET must match this host's OS/CPU. Use build for a remote target; run apply on the target host."
    requires:
      vars:
        - name: TARGET
          enum: [mac, linux, linux-arm64]
    cmds:
      - nix run --no-update-lock-file --inputs-from . home-manager -- switch --impure --no-update-lock-file --flake ".#{{index (dict "mac" "myHomeConfig" "linux" "linuxHomeConfig" "linux-arm64" "linuxArmHomeConfig") .TARGET}}"

  update:
    desc: "Update flake.lock only; review the diff before build/apply"
    cmds:
      - nix flake update
