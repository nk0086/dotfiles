# https://taskfile.dev

version: '3'

vars:
  HOME_CONFIG: myHomeConfig

tasks:
  default:
    cmds:
      - task --list
    silent: true

  format:nix:
    desc: "Format all Nix files with alejandra"
    sources:
      - "**/*.nix"
    cmds:
      - find . -name '*.nix' -not -path './.git/*' | xargs alejandra

  format:lua:
    desc: "Format all Lua files with stylua"
    sources:
      - "**/*.lua"
    cmds:
      - find . -name '*.lua' -not -path './.git/*' | xargs stylua

  format:
    desc: "Format all Nix and Lua files"
    deps: [format:nix, format:lua]

  check:nix:
    desc: "Check Nix formatting (dry-run)"
    cmds:
      - find . -name '*.nix' -not -path './.git/*' | xargs alejandra --check

  check:lua:
    desc: "Check Lua formatting (dry-run)"
    cmds:
      - find . -name '*.lua' -not -path './.git/*' | xargs stylua --check

  check:shell:
    desc: "Test zsh startup with isolated fixture files and commands"
    cmds:
      - python3 tests/test_shell_startup.py

  check:
    desc: "Check formatting and portable shell startup"
    deps: [check:nix, check:lua, check:shell]

  build:
    desc: "Build Home Manager without applying or updating dependencies"
    cmds:
      - nix build --no-update-lock-file ".#homeConfigurations.{{.HOME_CONFIG}}.activationPackage"

  apply:
    desc: "Apply Home Manager using the existing lock file"
    cmds:
      - nix run --no-update-lock-file --inputs-from . home-manager -- switch --no-update-lock-file --flake ".#{{.HOME_CONFIG}}"

  build:macos:
    desc: "Build the existing Apple Silicon macOS configuration"
    cmds:
      - task: build
        vars: {HOME_CONFIG: myHomeConfig}

  apply:macos:
    desc: "Apply the existing Apple Silicon macOS configuration"
    cmds:
      - task: apply
        vars: {HOME_CONFIG: myHomeConfig}

  build:linux:
    desc: "Build the x86_64 Linux configuration"
    cmds:
      - task: build
        vars: {HOME_CONFIG: linuxHomeConfig}

  apply:linux:
    desc: "Apply the x86_64 Linux configuration"
    cmds:
      - task: apply
        vars: {HOME_CONFIG: linuxHomeConfig}

  build:linux-arm64:
    desc: "Build the aarch64 Linux configuration"
    cmds:
      - task: build
        vars: {HOME_CONFIG: linuxArmHomeConfig}

  apply:linux-arm64:
    desc: "Apply the aarch64 Linux configuration"
    cmds:
      - task: apply
        vars: {HOME_CONFIG: linuxArmHomeConfig}

  sync:
    desc: "Alias for apply (existing macOS default)"
    cmds:
      - task: apply

  update:
    desc: "Update flake.lock only; review the diff before build/apply"
    cmds:
      - nix flake update
